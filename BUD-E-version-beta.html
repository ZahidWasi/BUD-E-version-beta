<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUD-E</title>
<style>
:root{--bg:#eef7fc;--card:#fff;--tx:#0e2433;--soft:#3f5a6b;--pri:#1f6f96;--on:#fff;--line:#c9dfec;--ok:#1d7a52;--bad:#b83a32;--warn:#8a5200;--sky:#d6ecf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1b26;--card:#14293a;--tx:#e8f3fa;--soft:#a9c3d4;--pri:#7cc4e8;--on:#08202e;--line:#27465c;--ok:#5fd1a0;--bad:#ff8a80;--warn:#f0b35a;--sky:#1b3a50}}
:root[data-theme="dark"]{--bg:#0c1b26;--card:#14293a;--tx:#e8f3fa;--soft:#a9c3d4;--pri:#7cc4e8;--on:#08202e;--line:#27465c;--ok:#5fd1a0;--bad:#ff8a80;--warn:#f0b35a;--sky:#1b3a50}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 ui-rounded,"Segoe UI",system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;background:none;border:0;color:var(--tx);min-height:44px;cursor:pointer}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover}
h1{font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.15;margin:.3em 0}h2{font-size:1.35rem;margin:.2em 0 .6em}h3{margin:.2em 0}
p{margin:.5em 0;max-width:64ch}.soft{color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
button,.btn,select,input{font:inherit;min-height:44px;border-radius:12px}
.btn,button.b{background:var(--pri);color:var(--on);border:0;padding:10px 20px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.alt,button.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
select,input{width:100%;padding:8px 12px;border:2px solid var(--line);background:var(--card);color:var(--tx)}
.err{color:var(--bad);margin:6px 0 0;font-size:.95rem}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--line);padding:10px 14px;margin:8px 0;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{min-width:64px}.chip[aria-pressed=true]{background:var(--pri);color:var(--on)}
.bar{height:8px;background:var(--sky);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.flow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}.flow li{flex:1 1 130px;background:var(--sky);border-radius:12px;padding:10px 12px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.hero img{width:150px;height:176px;border-radius:24px;object-fit:cover;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.pill{background:var(--sky);border-radius:99px;padding:4px 12px;font-size:.9rem;display:inline-block}
.hint{background:color-mix(in srgb,var(--warn) 14%,var(--card));border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(5,20,30,.6);display:grid;place-items:center;padding:16px;z-index:9}.modal .card{max-width:440px;width:100%;margin:0}
.fc{min-height:150px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px dashed var(--pri);padding:16px;cursor:pointer}
footer{padding:24px 16px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

onboard:()=>{const p=st.p,s=st.step,e=st.err||'';const T=['Your name','Subject','Chapter','Time available','Parent WhatsApp'];
let body=[`<label for="f">What should we call you?</label><input id="f" autocomplete="given-name" maxlength="40" value="${esc(p.name||'')}">`,
`<label for="f">Subject</label><select id="f"><option value="">Choose a subject</option>${Object.entries(SUBJ).map(([k,v])=>`<option value="${k}" ${p.subject===k?'selected':''}>${v[0]}</option>`).join('')}</select>`,
`<label for="f">Chapter</label><select id="f"><option value="">Choose a chapter</option>${(SUBJ[p.subject]||[0,[]])[1].map(c=>`<option ${p.chapter===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`,
`<label id="tl">How many hours can you give?</label><div class="chips" role="group" aria-labelledby="tl">${[2,3,4,5].map(h=>`<button class="opt chip" style="width:auto;margin:0" aria-pressed="${p.time===h}" data-a="time" data-j="${h}">${h===5?'5+':h} hrs</button>`).join('')}</div>`,
`<label for="f">Parent's WhatsApp number</label><input id="f" type="tel" inputmode="tel" placeholder="+919876543210" value="${esc(p.phone||'')}"><p class="soft">Include the country code. Used only if you leave a break unfinished.</p>`][s];
return `${bar(s+1,5)}<div class="card"><p class="soft">Step ${s+1} of 5 &middot; ${T[s]}</p>${body}<p class="err" role="alert">${esc(e)}</p><div class="row">${s?'<button class="b alt" data-a="back">Back</button>':''}<button class="b" data-a="nextstep">${s==4?'Start calibration':'Next'}</button></div></div>`},
calibrate:()=>{if(!hasBank())return empty();const i=st.i,q=BANK[i];return qView(q,i,10)+`<div class="row" id="nx"></div>`},
calres:()=>`<div class="card"><h2>Your level: ${st.level}</h2><p>You scored <b>${st.score}/10</b> on ${esc(st.p.chapter)}.</p><p class="soft">${{Foundation:'We\'ll start from the basics and build up.',Intermediate:'You know the core ideas. We\'ll sharpen them.',Advanced:'Strong base. We\'ll push on tougher questions.'}[st.level]}</p><div class="row"><button class="b" data-a="learn">Go to lecture</button></div></div>`,
learn:()=>{const id=PLACEHOLDER;return `<h2>Learn: ${esc(st.p.chapter)}</h2><p class="soft">${st.level} level &middot; ${st.p.time===5?'5+':st.p.time} hr sprint</p><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Lecture video" loading="lazy" allowfullscreen></iframe></div><p class="soft">Placeholder video: the real lecture link for this combination hasn't been added yet.</p><div class="row"><button class="b" data-a="practice">Skip lecture for now and proceed to question practice</button></div>`},
practice:()=>{const n=Math.min(10,{Foundation:6,Intermediate:8,Advanced:10}[st.level]),i=st.i;if(i>=n)return `<div class="card"><h2>Practice done</h2><p>${st.pc} of ${n} correct.</p><p class="soft">Next is a timed test with no hints.</p><div class="row"><button class="b" data-a="test">Start the test</button></div></div>`;
st.n=n;const q=BANK[i];return qView(q,i,n,`<div class="hint" id="hint" hidden><b>Hint:</b> ${esc(q[3])}</div><div id="sol"></div><div class="row" id="nx"></div>`)},
test:()=>{if(st.i>=st.tn){return `<div class="card"><h2>Test complete</h2><p>You scored <b>${st.ts}/${st.tn}</b>.</p><div class="row"><button class="b" data-a="recall">Go to Recall</button></div></div>`}
const q=BANK[9-st.i];return `<p><span class="pill" id="tt">Time left ${fmt(st.tleft)}</span> &nbsp;No hints in the test</p>`+qView(q,st.i,st.tn)},
recall:()=>{const c=st.seen;return `<h2>Recall</h2><p class="soft">Tap a card to flip it.</p><div class="grid">${c.map((k,x)=>`<button class="fc" data-a="flip" data-j="${x}" aria-label="Flashcard ${x+1}">${st['f'+x]?`<b>${esc(BANK[k][1][BANK[k][2]])}</b><br><span class="soft">${esc(BANK[k][4])}</span>`:esc(BANK[k][0])}</button>`).join('')}</div><h2 style="margin-top:24px">Notes from your mistakes</h2>${st.wrong.length?st.wrong.map(w=>`<div class="card"><b>${esc(BANK[w.k][0])}</b><p>You chose: ${esc(BANK[w.k][1][w.j])}. Correct: <b>${esc(BANK[w.k][1][BANK[w.k][2]])}</b></p><p class="soft">${esc(BANK[w.k][4])}</p></div>`).join(''):'<div class="card"><p>No mistakes recorded. Nice work.</p></div>'}<div class="row"><button class="b" data-a="start">Start a new sprint</button></div>`}};
function pick(j,mode){const k=mode==='test'?9-st.i:st.i,q=BANK[k],right=j===q[2];
document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(x===q[2])b.classList.add('ok');else if(x===j)b.classList.add('bad')});
if(!right&&!st.wrong.some(w=>w.k===k))st.wrong.push({k,j});if(!st.seen.includes(k))st.seen.push(k);
if(mode==='cal'){if(right)st.score++;setTimeout(()=>{st.i++;if(st.i>=10){st.level=st.score>=8?'Advanced':st.score>=5?'Intermediate':'Foundation';go('calres')}else R()},700)}
else if(mode==='pr'){if(right)st.pc++;clearTimeout(hintT);$('#nx').innerHTML='<button class="b alt" data-a="sol">View Solution</button><button class="b" data-a="nq">Next</button>'}
else{if(right)st.ts++;setTimeout(()=>{st.i++;R()},500)}}
function modalShow(html){modal=true;const d=document.createElement('div');d.className='modal';d.id='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=`<div class="card">${html}</div>`;document.body.appendChild(d);const b=d.querySelector('button');b&&b.focus();d.addEventListener('keydown',e=>{if(e.key==='Tab'){const x=[...d.querySelectorAll('button,a')];const f=x[0],l=x[x.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}})}
const closeModal=()=>{const d=$('#modal');d&&d.remove();modal=false};
function breakAsk(){modalShow('<h2>Take a 10-min break?</h2><p class="soft">You\'ve studied for 45 minutes. A short rest helps memory.</p><div class="row"><button class="b" data-a="brk-yes">Yes</button><button class="b alt" data-a="brk-no">No</button></div>')}
function startTest(){st.tn=6;st.ts=0;st.tleft=180000;st.i=0;go('test');st.stage='test';const t0=Date.now(),L=st.tleft;testT=setInterval(()=>{if(onBreak)return;st.tleft-=1000*TS;const e=$('#tt');if(e)e.textContent='Time left '+fmt(st.tleft);if(st.tleft<=0){clearInterval(testT);st.i=st.tn;R()}},1000)}
function breakView(){const r=15*6e4-bm,remind=bm>=10*6e4,alerted=bm>=15*6e4;
const num=(st.p.phone||'').replace(/\D/g,''),msg=encodeURIComponent('Your ward has left their learning sprint in between.');
$('#modal .card').innerHTML=`<h2>${alerted?'Break time is over':'On break'}</h2><p class="soft">Break time left: <b>${fmt(r)}</b></p>${remind&&!alerted?'<div class="hint" role="alert">Please head back soon. If you don\'t return in 15 minutes, your parent will be notified.</div>':''}${alerted?`<div class="hint" role="alert">Your parent is being told you left the sprint. In this preview, tap below to open the WhatsApp message.</div><a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${msg}">Open WhatsApp message</a>`:''}<div class="row"><button class="b" data-a="resume-brk">To resume learning, click here</button></div>`}
setInterval(()=>{const n=Date.now(),dt=(n-last)*TS;last=n;
if(onBreak){bm+=dt;if($('#modal'))breakView();return}
if(['learn','practice','test'].includes(st.stage)&&!modal){am+=dt;hdr();if(am>=next)breakAsk()}},1000);
document.addEventListener('visibilitychange',()=>{last=last}); // timers use timestamps, so background tabs stay accurate
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,j=+b.dataset.j,p=st.p;
switch(a){
case'home':go('home');break;
case'resume':case'start':if(a==='start'){st.step=0;if(!p.name)p.name=''}st.err='';st.score=0;st.pc=0;st.wrong=[];st.seen=[];go('onboard');break;
case'time':p.time=j;R();break;
case'back':st.step--;st.err='';R();break;
case'redo':st.step=2;go('onboard');break;
case'nextstep':{const f=$('#f'),v=f?f.value.trim():'',s=st.step;let e='';
 if(s===0){if(!/^[\p{L} .'-]{2,40}$/u.test(v))e='Enter your name using 2 to 40 letters.';else p.name=v}
 if(s===1){if(!v)e='Choose a subject.';else if(p.subject!==v){p.subject=v;p.chapter=''}}
 if(s===2){if(!v)e='Choose a chapter.';else p.chapter=v}
 if(s===3&&!p.time)e='Choose how many hours you have.';
 if(s===4){const n=v.replace(/[\s-]/g,'');if(!/^\+[1-9]\d{7,14}$/.test(n))e='Enter the number with country code, like +919876543210.';else p.phone=n}
 st.err=e;if(e){R();break}save();if(s<4){st.step++;R()}else{am=0;bm=0;next=45*6e4;st.score=0;st.pc=0;st.wrong=[];st.seen=[];go('calibrate')}break}
case'pick':pick(j,st.stage==='calibrate'?'cal':st.stage==='practice'?'pr':'test');break;
case'learn':go('learn');break;
case'practice':st.pc=0;go('practice');break;
case'sol':$('#sol').innerHTML=`<div class="card"><b>Solution</b><p>${esc(BANK[st.i][4])}</p></div>`;b.remove();break;
case'nq':st.i++;R();break;
case'test':startTest();break;
case'recall':go('recall');break;
case'flip':st['f'+j]=!st['f'+j];R();break;
case'brk-no':next+=45*6e4;closeModal();break;
case'brk-yes':closeModal();onBreak=true;bm=0;modalShow('');breakView();break;
case'resume-brk':onBreak=false;next=am+45*6e4;closeModal();break;
case'demo':TS=60;b.remove();break;}});
R();
</script>
</body>
</html>
